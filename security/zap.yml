env:
  contexts:
    - name: Democyber
      urls:
        - http://app:8080
  parameters:
    failOnError: true
    failOnWarning: true
jobs:
  - type: passiveScan-config
    parameters:
      scanOnlyInScope: true
  - type: requestor
    requests:
      - url: http://app:8080/
        method: GET
        responseCode: 200
      - url: http://app:8080/actuator/health
        method: GET
        responseCode: 200
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: report
    parameters:
      template: traditional-json
      reportDir: /tmp
      reportFile: zap-passive.json
  - type: exitStatus
    parameters:
      errorLevel: Medium
      warnLevel: Low
      okExitValue: 0
      errorExitValue: 1
      warnExitValue: 0
