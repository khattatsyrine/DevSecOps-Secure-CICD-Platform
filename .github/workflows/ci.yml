name: Secure CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      APP_IMAGE: democyber:${{ github.sha }}
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed content
        shell: pwsh
        run: ./scripts/scan.ps1 -Mode Source
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - name: Build and run JUnit tests
        id: maven
        run: ./mvnw -B -ntp clean verify
      - name: Enforce SonarQube Cloud Quality Gate
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: ./scripts/sonar.ps1
      - name: Build the candidate once
        if: ${{ !cancelled() && steps.maven.outcome == 'success' }}
        id: candidate
        run: |
          set -euo pipefail
          docker build --provenance=false --sbom=false --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$APP_IMAGE" .
          printf 'id=%s\n' "$(docker image inspect --format '{{.Id}}' "$APP_IMAGE")" >> "$GITHUB_OUTPUT"
      - name: Generate the SBOM and enforce Trivy policy
        id: trivy
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        shell: pwsh
        env:
          VERIFIED_IMAGE_ID: ${{ steps.candidate.outputs.id }}
        run: ./scripts/scan.ps1 -Mode Image -ImageId $env:VERIFIED_IMAGE_ID
      - name: Verify the scanned image in disposable Compose
        if: ${{ !cancelled() && steps.trivy.outcome == 'success' }}
        shell: pwsh
        env:
          VERIFIED_IMAGE_ID: ${{ steps.candidate.outputs.id }}
        run: ./scripts/runtime.ps1 -ImageId $env:VERIFIED_IMAGE_ID
      - name: Require a trusted SonarQube analysis for fork changes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::A maintainer must review and cherry-pick this change onto a branch in this repository, then open a replacement PR for credentialed verification."
          exit 1
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            evidence/gitleaks.json
            evidence/sbom.cdx.json
            evidence/trivy.json
            evidence/scanned-image-id.txt
            evidence/runtime.txt
            evidence/zap-passive.json
      - name: Export checked image for trusted main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected
        shell: pwsh
        env:
          VERIFIED_IMAGE_ID: ${{ steps.candidate.outputs.id }}
        run: ./scripts/export.ps1 -ImageId $env:VERIFIED_IMAGE_ID -Commit $env:GITHUB_SHA
      - name: Transfer verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-image-${{ github.run_attempt }}
          path: evidence/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to GHCR
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && vars.GHCR_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Download verified image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked-image-${{ github.run_attempt }}
          path: checked
      - name: Verify archive and loaded image identity
        run: |
          set -euo pipefail
          commit=$(jq -er '.sourceCommit | select(test("^[0-9a-f]{40}$"))' checked/metadata.json)
          image_id=$(jq -er '.imageId | select(test("^sha256:[0-9a-f]{64}$"))' checked/metadata.json)
          archive_hash=$(jq -er '.archiveSha256 | select(test("^[0-9a-f]{64}$"))' checked/metadata.json)
          [[ "$commit" == "$GITHUB_SHA" ]]
          printf '%s  checked/image.tar\n' "$archive_hash" | sha256sum --check --strict
          docker image load --input checked/image.tar
          [[ "$(docker image inspect --format '{{.Id}}' "democyber:$commit")" == "$image_id" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_id")" == "$commit" ]]
      - name: Push and record registry manifest digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d)"
          trap 'docker logout ghcr.io >/dev/null 2>&1; rm -rf -- "$DOCKER_CONFIG"' EXIT
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$image:$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker image tag "democyber:$GITHUB_SHA" "$tag"
          docker image push "$tag" | tee "$RUNNER_TEMP/ghcr-push.log"
          digest=$(sed -nE "s/^[^ ]+: digest: (sha256:[0-9a-f]{64}) size: [0-9]+$/\1/p" "$RUNNER_TEMP/ghcr-push.log")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "$image@$digest" > checked/manifest.json
          config_path=$(tar -xOf checked/image.tar manifest.json | jq -er 'if length == 1 then .[0].Config else error("expected one image") end')
          [[ "$config_path" =~ ^(blobs/sha256/[0-9a-f]{64}|[0-9a-f]{64}\.json)$ ]]
          config_sha=$(tar -xOf checked/image.tar "$config_path" | sha256sum | cut -d' ' -f1)
          [[ "$(jq -er '.config.digest' checked/manifest.json)" == "sha256:$config_sha" ]]
          jq --arg image "$tag" --arg digest "$digest" \
            '. + {registryImage: $image, registryDigest: $digest}' checked/metadata.json > checked/release.json
          printf 'Image `%s@%s`\n\nSource commit `%s`\n' "$image" "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_attempt }}
          path: checked/release.json
          if-no-files-found: error
          retention-days: 30
